<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funtechs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="#" class="logo">@Funtechs</a>
            <nav class="nav">
                <a href="#" class="nav-link nav-link-active">HOME</a>
                <a href="#" class="nav-link">CONTACT</a>

                <button class="btn btn-outline btn-small">SIGN IN</button>
                <button class="btn btn-blue btn-small">SIGN UP</button>

        </header>
 
        <main class="hero">

                    Lorem ipsum dolor sit amet, consectetur adipiscing elit.<br>

                <div class="hero-buttons">
                    <button class="btn btn-blue">GETTING STARTED</button>
                    <button class="btn btn-outline">CALL US NOW</button>
                </div>
            </div>
            <img class="hero-image" src="img/hero.svg" alt="hero">
        </main>
 
        <div class="partners">
            <div class="partner-circle">
                <img src="img/google.png" alt="Google">
            </div>

                <img src="img/facebook.png" alt="Facebook">
            </div>
            <div class="partner-circle">
                <img src="img/youtube.png" alt="YouTube">
            </div>
            <div class="partner-circle">
                <img src="img/linkedin.png" alt="LinkedIn">
            </div>
            <div class="partner-circle">
                <img src="img/magento.png" alt="Magento">
            </div>
            <img class="partner-logo" src="img/fiverr.png" alt="Fiverr">
            <img class="partner-logo" src="img/netflix.png" alt="Netflix">
        </div>
    </div>

</html>
